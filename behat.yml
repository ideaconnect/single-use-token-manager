default:
  suites:
    array_adapter:
      contexts:
        - GryfOSS\Tests\SingleUseTokenManager\Behat\TokenContext
        - GryfOSS\Tests\SingleUseTokenManager\Behat\ArrayAdapterTokenServiceContext
      filters:
        tags: "@array"

    redis_tags:
      contexts:
        - GryfOSS\Tests\SingleUseTokenManager\Behat\TokenContext
        - GryfOSS\Tests\SingleUseTokenManager\Behat\RedisTagsTokenServiceContext:
            host: 'localhost'
            port: 6379
      filters:
        tags: "@redis_tags"

    redis_no_tags:
      contexts:
        - GryfOSS\Tests\SingleUseTokenManager\Behat\TokenContext
        - GryfOSS\Tests\SingleUseTokenManager\Behat\RedisNoTagsTokenServiceContext:
            host: 'localhost'
            port: 6380
      filters:
        tags: "@redis_no_tags"
