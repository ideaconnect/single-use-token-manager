services:
  # Backs the redis_no_tags Behat suite through the Symfony PSR-16 wrapper.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Backs the rapid_cache_tags Behat suite through idct/php-rapid-cache-client.
  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6380:6379"
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
