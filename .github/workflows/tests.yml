name: Tests

on:
  push:
    branches: [ main, master, psr-cache ]
  pull_request:
    branches: [ main, master, psr-cache ]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} - Unit Tests, Coverage & Functional Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
      fail-fast: false  # Continue testing other PHP versions even if one fails

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-no-tags:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: redis, json, mbstring
        coverage: xdebug

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist

    # Requirement 1: Unit tests working
    - name: ✅ Run unit tests (PHP ${{ matrix.php-version }})
      run: |
        echo "🧪 Running unit tests on PHP ${{ matrix.php-version }}..."
        ./vendor/bin/phpunit
        echo "✅ Unit tests completed successfully on PHP ${{ matrix.php-version }}"

    # Requirement 2: 100% code coverage verification (only run on PHP 8.3 for performance)
    - name: ✅ Verify 100% code coverage
      if: matrix.php-version == '8.3'
      run: |
        echo "📊 Checking code coverage..."
        XDEBUG_MODE=coverage ./vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text

        # Extract coverage percentage
        COVERAGE=$(php -r "
        \$xml = simplexml_load_file('coverage.xml');
        \$metrics = \$xml->project->metrics;
        \$covered = (int)\$metrics['coveredstatements'];
        \$total = (int)\$metrics['statements'];
        \$percentage = (\$total > 0) ? round((\$covered / \$total) * 100, 2) : 0;
        echo \$percentage;
        ")

        echo "Code coverage: ${COVERAGE}%"

        if [ "$COVERAGE" != "100" ]; then
          echo "❌ Coverage is not 100%: ${COVERAGE}%"
          exit 1
        fi

        echo "✅ 100% code coverage verified"

    # Requirement 3: Functional tests working
    - name: ✅ Run functional tests (PHP ${{ matrix.php-version }})
      run: |
        echo "🧪 Running functional tests on PHP ${{ matrix.php-version }}..."

        # Wait for Redis services
        timeout 30 bash -c 'until nc -z localhost 6379; do sleep 1; done'
        timeout 30 bash -c 'until nc -z localhost 6380; do sleep 1; done'

        # Test offline storage (ArrayAdapter)
        echo "Testing ArrayAdapter (offline storage)..."
        ./vendor/bin/behat --suite=array_adapter

        # Test online storage with tags (Redis)
        echo "Testing Redis with tags (online storage + tag support)..."
        ./vendor/bin/behat --suite=redis_tags

        # Test online storage without tags (Redis)
        echo "Testing Redis without tags (online storage, no tag support)..."
        ./vendor/bin/behat --suite=redis_no_tags

        echo "✅ All functional tests completed successfully on PHP ${{ matrix.php-version }}"

    - name: 🎉 Test Summary (PHP ${{ matrix.php-version }})
      run: |
        echo "🎯 All Requirements Met for PHP ${{ matrix.php-version }}:"
        echo "✅ Unit tests are working"
        if [ "${{ matrix.php-version }}" == "8.3" ]; then
          echo "✅ Code coverage is 100%"
        fi
        echo "✅ Functional tests are working"
        echo ""
        echo "Test Coverage:"
        echo "- Offline storage: ArrayAdapter"
        echo "- Online storage with tags: Redis + TagAwareAdapter"
        echo "- Online storage without tags: Redis + RedisAdapter"

  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: redis, json, mbstring
        coverage: xdebug

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist

    - name: Generate coverage report
      run: |
        echo "📊 Generating comprehensive coverage report..."
        XDEBUG_MODE=coverage ./vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-html=coverage-html --coverage-text

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage.xml
          coverage-html/
        retention-days: 30

    - name: Coverage Summary
      run: |
        echo "📈 Coverage Report Generated:"
        echo "- XML report: coverage.xml"
        echo "- HTML report: coverage-html/"
        echo "- Available as GitHub Actions artifact"
